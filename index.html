<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f6f8;color:#20242a}
.app{display:flex;min-height:100vh}.side{width:230px;background:#17191d;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}
.logo{font-size:21px;font-weight:800;padding:8px 12px 22px}.nav button{display:block;width:100%;border:0;background:transparent;color:#c8ccd2;text-align:left;padding:12px;border-radius:9px;margin:4px 0;cursor:pointer;font-size:15px}.nav button.active,.nav button:hover{background:#2a2e35;color:#fff}
.main{margin-left:230px;width:calc(100% - 230px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:27px}.btn{border:0;border-radius:9px;padding:10px 15px;background:#1d232b;color:#fff;cursor:pointer}.btn.secondary{background:#e9ebee;color:#222}.btn.danger{background:#c92a2a}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:18px;box-shadow:0 2px 8px #00000008}.label{color:#6b7280;font-size:13px}.value{font-size:25px;font-weight:750;margin-top:7px}.green{color:#138a4b}.red{color:#c62b35}.blue{color:#2563eb}.orange{color:#b45309}
.section{margin-top:20px}.section h2{font-size:18px;margin:0 0 12px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:18px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee;font-size:14px}th{color:#666;font-weight:600}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.form label{font-size:13px;color:#555}.form input,.form select{width:100%;margin-top:5px;padding:10px;border:1px solid #d8dbe0;border-radius:8px;background:#fff}.form .full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:12px}
.progress{height:9px;background:#eee;border-radius:10px;overflow:hidden}.bar{height:100%;background:#2563eb}.muted{color:#777;font-size:13px}.hidden{display:none}.empty{padding:25px;text-align:center;color:#777}
@media(max-width:900px){.side{width:70px}.logo{font-size:0}.logo:after{content:"FP";font-size:18px}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:22px}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid,.form{grid-template-columns:1fr}.main{padding:12px}.top h1{font-size:22px}table{min-width:650px}.panel{overflow:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo">Finance Planner</div><div class="nav">
<button data-page="dashboard" class="active">Dashboard</button>
<button data-page="transactions">รายรับ / รายจ่าย</button>
<button data-page="withdraw">เบิกจ่าย</button>
<button data-page="budget">วางแผนงบประมาณ</button>
<button data-page="reports">รายงาน</button>
</div></aside>
<main class="main">
<div class="top"><h1 id="title">Dashboard</h1><button class="btn secondary" onclick="exportData()">สำรองข้อมูล</button></div>

<section id="dashboard" class="page">
<div class="grid">
<div class="card"><div class="label">เงินคงเหลือ</div><div class="value blue" id="balance">฿0</div></div>
<div class="card"><div class="label">รายรับเดือนนี้</div><div class="value green" id="income">฿0</div></div>
<div class="card"><div class="label">รายจ่ายเดือนนี้</div><div class="value red" id="expense">฿0</div></div>
<div class="card"><div class="label">รอเบิกจ่าย</div><div class="value orange" id="pending">฿0</div></div>
</div>
<div class="section"><div class="panel"><h2>รายการล่าสุด</h2><div id="recent"></div></div></div>
</section>

<section id="transactions" class="page hidden">
<div class="panel">
<h2>เพิ่มรายการ</h2>
<div class="form">
<label>ประเภท<select id="txType"><option value="income">รายรับ</option><option value="expense">รายจ่าย</option></select></label>
<label>วันที่<input id="txDate" type="date"></label>
<label>หมวดหมู่<input id="txCat" placeholder="เช่น ค่าอาหาร / ขายสินค้า"></label>
<label>จำนวนเงิน<input id="txAmount" type="number" min="0" step="0.01" placeholder="0"></label>
<label class="full">รายละเอียด<input id="txNote" placeholder="รายละเอียดเพิ่มเติม"></label>
</div><div class="actions"><button class="btn" onclick="addTx()">บันทึกรายการ</button></div>
</div>
<div class="section panel"><h2>รายการทั้งหมด</h2><div id="txTable"></div></div>
</section>

<section id="withdraw" class="page hidden">
<div class="panel"><h2>เพิ่มรายการเบิกจ่าย</h2>
<div class="form">
<label>วันที่<input id="wdDate" type="date"></label><label>รายการ<input id="wdNote" placeholder="เช่น ซื้อสินค้า"></label>
<label>หมวดหมู่<input id="wdCat" placeholder="เช่น สินค้า"></label><label>จำนวนเงิน<input id="wdAmount" type="number" min="0" step="0.01"></label>
</div><div class="actions"><button class="btn" onclick="addWd()">บันทึก</button></div></div>
<div class="section panel"><h2>รายการเบิกจ่าย</h2><div id="wdTable"></div></div>
</section>

<section id="budget" class="page hidden">
<div class="panel"><h2>ตั้งงบประมาณรายเดือน</h2>
<div class="form"><label>หมวดหมู่<input id="bgCat" placeholder="เช่น โฆษณา"></label><label>งบประมาณ<input id="bgAmount" type="number" min="0"></label></div>
<div class="actions"><button class="btn" onclick="addBudget()">เพิ่มงบ</button></div></div>
<div class="section panel"><h2>งบประมาณเดือนปัจจุบัน</h2><div id="budgetTable"></div></div>
</section>

<section id="reports" class="page hidden">
<div class="panel"><h2>สรุปเดือนปัจจุบัน</h2><div id="report"></div></div>
<div class="section panel"><h2>ข้อมูล</h2><button class="btn danger" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button></div>
</section>
</main></div>
<script>
const KEY="finance_planner_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"tx":[],"wd":[],"budget":[]}');
const today=()=>new Date().toISOString().slice(0,10);
document.getElementById("txDate").value=today(); document.getElementById("wdDate").value=today();
const money=n=>new Intl.NumberFormat("th-TH",{style:"currency",currency:"THB",maximumFractionDigits:2}).format(n||0);
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const month=()=>new Date().toISOString().slice(0,7);
function addTx(){
 let amount=+txAmount.value;if(!amount)return alert("กรุณาใส่จำนวนเงิน");
 db.tx.unshift({id:Date.now(),type:txType.value,date:txDate.value,cat:txCat.value||"ไม่ระบุ",amount,note:txNote.value});
 txCat.value=txAmount.value=txNote.value="";save();
}
function addWd(){
 let amount=+wdAmount.value;if(!amount)return alert("กรุณาใส่จำนวนเงิน");
 db.wd.unshift({id:Date.now(),date:wdDate.value,cat:wdCat.value||"ไม่ระบุ",amount,note:wdNote.value,status:"pending"});
 wdAmount.value=wdCat.value=wdNote.value="";save();
}
function addBudget(){let a=+bgAmount.value;if(!a||!bgCat.value)return alert("กรุณากรอกข้อมูล");db.budget.push({id:Date.now(),cat:bgCat.value,amount:a});bgCat.value=bgAmount.value="";save()}
function del(type,id){db[type]=db[type].filter(x=>x.id!==id);save()}
function paid(id){let x=db.wd.find(x=>x.id===id);if(x){x.status="paid";save()}}
function render(){
 const m=month(), tx=db.tx.filter(x=>x.date.startsWith(m)), inc=tx.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0), exp=tx.filter(x=>x.type==="expense").reduce((s,x)=>s+x.amount,0);
 const pending=db.wd.filter(x=>x.status==="pending").reduce((s,x)=>s+x.amount,0), allInc=db.tx.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0), allExp=db.tx.filter(x=>x.type==="expense").reduce((s,x)=>s+x.amount,0);
 balance.textContent=money(allInc-allExp);income.textContent=money(inc);expense.textContent=money(exp);pending.textContent=money(pending);
 recent.innerHTML=db.tx.slice(0,7).map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span>${esc(x.date)} · ${esc(x.cat)}<br><small class="muted">${esc(x.note)}</small></span><b class="${x.type==="income"?"green":"red"}">${x.type==="income"?"+":"-"}${money(x.amount)}</b></div>`).join("")||'<div class="empty">ยังไม่มีรายการ</div>';
 txTable.innerHTML=`<table><tr><th>วันที่</th><th>ประเภท</th><th>หมวดหมู่</th><th>รายละเอียด</th><th>จำนวนเงิน</th><th></th></tr>${db.tx.map(x=>`<tr><td>${esc(x.date)}</td><td>${x.type==="income"?"รายรับ":"รายจ่าย"}</td><td>${esc(x.cat)}</td><td>${esc(x.note)}</td><td>${money(x.amount)}</td><td><button class="btn secondary" onclick="del('tx',${x.id})">ลบ</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">ยังไม่มีรายการ</td></tr>'}</table>`;
 wdTable.innerHTML=`<table><tr><th>วันที่</th><th>รายการ</th><th>หมวดหมู่</th><th>จำนวนเงิน</th><th>สถานะ</th><th></th></tr>${db.wd.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.note)}</td><td>${esc(x.cat)}</td><td>${money(x.amount)}</td><td>${x.status==="pending"?"รอเบิก":"เบิกแล้ว"}</td><td>${x.status==="pending"?`<button class="btn secondary" onclick="paid(${x.id})">เบิกแล้ว</button>`:""} <button class="btn secondary" onclick="del('wd',${x.id})">ลบ</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">ยังไม่มีรายการ</td></tr>'}</table>`;
 budgetTable.innerHTML=db.budget.map(b=>{let used=tx.filter(x=>x.type==="expense"&&x.cat===b.cat).reduce((s,x)=>s+x.amount,0), pct=Math.min(100,used/b.amount*100);return `<div style="margin:16px 0"><div style="display:flex;justify-content:space-between"><b>${esc(b.cat)}</b><span>${money(used)} / ${money(b.amount)}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="muted">${pct.toFixed(0)}% ของงบ <button class="btn secondary" style="float:right;padding:4px 8px" onclick="del('budget',${b.id})">ลบ</button></div></div>`}).join("")||'<div class="empty">ยังไม่ได้ตั้งงบ</div>';
 report.innerHTML=`<p>รายรับเดือนนี้ <b class="green">${money(inc)}</b></p><p>รายจ่ายเดือนนี้ <b class="red">${money(exp)}</b></p><p>คงเหลือสุทธิ <b>${money(inc-exp)}</b></p><p>รายการทั้งหมด ${tx.length} รายการ</p>`;
}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="finance-backup.json";a.click()}
function clearAll(){if(confirm("ล้างข้อมูลทั้งหมดจริงหรือไม่?")){db={tx:[],wd:[],budget:[]};save()}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));document.getElementById(b.dataset.page).classList.remove("hidden");title.textContent=b.textContent});
render();
</script></body></html>
